<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Admin | Presyo ng Bigas</title>
<style>
:root{--bg:#fff;--ink:#111;--mute:#6b7280;--line:#e5e7eb;--accent:#1f7a4d;--bad:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#0e0f0e;--ink:#f3f4f3;--mute:#9ca3a0;--line:#26292a;--accent:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:2rem 1.25rem}
.box{max-width:1000px;margin:0 auto}
h1{font-size:1.1rem;font-weight:600;margin:0 0 1.5rem}
a{color:var(--accent)}
input,select,button{font:inherit;padding:.5rem .65rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
button{cursor:pointer;background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:500}
button.del{background:transparent;color:var(--bad);border-color:var(--line)}
button.tab{background:transparent;color:var(--mute);border-color:transparent}
button.tab.on{color:var(--ink);border-color:var(--line)}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}.grow{flex:1}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:.5rem;border-bottom:1px solid var(--line);text-align:left}
tr:last-child td{border-bottom:0}
th{color:var(--mute);font-weight:500;font-size:.85rem;text-transform:capitalize}
tr.new{background:color-mix(in srgb,var(--accent) 8%,transparent)}
#msg{min-height:1.5rem;color:var(--mute)}
.hint{color:var(--mute);font-size:.85rem}
#checking{color:var(--mute);text-align:center;margin-top:4rem}
</style></head><body><div class="box">
<p id="checking">Checking sign-in...</p>
<div id="app" hidden>
<h1>Admin</h1>
<div class="bar"><button class="tab on" data-t="prices">Prices</button><button class="tab" data-t="regions">Regions</button><button class="tab" data-t="varieties">Varieties</button><span class="grow"></span><a href="index.html">View public site</a><button id="out" class="del">Sign out</button></div>
<p id="msg" role="status"></p>
<div class="wrap"><table><thead id="head"></thead><tbody id="body"></tbody></table></div>
<p class="hint">Prices shows the 200 most recent entries. The shaded top row adds a new entry.</p>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T={prices:[['date','date'],['region_id','ref:regions'],['variety_id','ref:varieties'],['price_per_kg','number'],['source','text']],
 regions:[['name','text'],['sort_order','number']],varieties:[['name','text']]};
let tab='prices',refs={regions:[],varieties:[]};
const msg=t=>$('msg').textContent=t;
// Gate: only signed-in admins may see this page, everyone else goes to login.html
async function start(){
 const{data:{session}}=await sb.auth.getSession();
 if(!session){location.replace('login.html');return}
 const{data:ok}=await sb.rpc('is_admin');
 if(!ok){await sb.auth.signOut();location.replace('login.html?denied=1');return}
 $('checking').hidden=true;$('app').hidden=false;load()}
$('out').onclick=async()=>{await sb.auth.signOut();location.replace('login.html')};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));load()});
function cell(c,t,v){
 if(t.startsWith('ref:'))return`<select data-c="${c}" data-t="ref">${refs[t.slice(4)].map(o=>`<option value="${o.id}" ${o.id==v?'selected':''}>${esc(o.name)}</option>`).join('')}</select>`;
 return`<input data-c="${c}" data-t="${t}" type="${t}" ${t==='number'?'step="any"':''} value="${esc(v)}">`}
async function load(){
 msg('Loading...');
 refs.regions=(await sb.from('regions').select('*').order('sort_order')).data||[];
 refs.varieties=(await sb.from('varieties').select('*').order('name')).data||[];
 let q=sb.from(tab).select('*');q=tab==='prices'?q.order('date',{ascending:false}).limit(200):q.order(tab==='regions'?'sort_order':'name');
 const{data,error}=await q;if(error)return msg(error.message);
 $('head').innerHTML='<tr>'+T[tab].map(c=>`<th>${c[0].replace(/_/g,' ')}</th>`).join('')+'<th></th></tr>';
 const blank=tab==='prices'?{date:new Date().toISOString().slice(0,10)}:{};
 $('body').innerHTML=[blank,...data].map(r=>`<tr data-id="${r.id??''}" class="${r.id?'':'new'}">`+T[tab].map(([c,t])=>`<td>${cell(c,t,r[c])}</td>`).join('')+
  `<td><button data-a="save">${r.id?'Save':'Add'}</button> ${r.id?'<button class="del" data-a="del">Delete</button>':''}</td></tr>`).join('');
 msg('')}
$('body').onclick=async e=>{const a=e.target.dataset.a;if(!a)return;const tr=e.target.closest('tr'),id=tr.dataset.id;let r;
 if(a==='del'){if(!confirm('Delete this entry? This cannot be undone.'))return;r=await sb.from(tab).delete().eq('id',id)}
 else{const row={};tr.querySelectorAll('[data-c]').forEach(el=>{const v=el.value;row[el.dataset.c]=v===''?null:(el.dataset.t==='number'||el.dataset.t==='ref'?Number(v):v)});
  r=id?await sb.from(tab).update(row).eq('id',id):await sb.from(tab).insert(row)}
 if(r.error)return msg('Error: '+r.error.message);await load();msg(a==='del'?'Deleted.':'Saved.')};
start();
</script></body></html>

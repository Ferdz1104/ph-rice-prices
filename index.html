<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presyo ng Bigas | Philippine Rice Prices</title>
<style>
:root{--bg:#fff;--ink:#111;--mute:#6b7280;--line:#e5e7eb;--accent:#1f7a4d;--up:#c2410c;--down:#1f7a4d}
@media(prefers-color-scheme:dark){:root{--bg:#0e0f0e;--ink:#f3f4f3;--mute:#9ca3a0;--line:#26292a;--accent:#4ade80;--up:#fb923c;--down:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:3rem 1.25rem 2rem}
h1{font-size:1.1rem;font-weight:600;margin:0 0 .25rem;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 2rem;font-size:.95rem}
.filters{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:2rem}
select{flex:1;min-width:180px;font:inherit;padding:.6rem .75rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
select:focus{outline:2px solid var(--accent);outline-offset:1px}
.big{font-size:clamp(2.6rem,10vw,3.8rem);font-weight:700;letter-spacing:-.03em;line-height:1}
.meta{margin:.5rem 0 1.5rem;color:var(--mute);font-size:.9rem}
.up{color:var(--up)}.down{color:var(--down)}
.chartbox{position:relative;height:240px;margin-bottom:2.5rem}
h2{font-size:.8rem;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:0 0 .5rem}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.65rem 0;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--mute);font-size:.85rem}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}tbody tr:hover td,tr.sel td{background:color-mix(in srgb,var(--accent) 8%,transparent)}
#msg{color:var(--mute);min-height:1.5rem}
footer{max-width:720px;margin:0 auto;padding:0 1.25rem 3rem;color:var(--mute);font-size:.8rem}
</style></head><body>
<main>
<h1>Presyo ng Bigas</h1>
<p class="sub">Rice prices per kilo across the Philippines.</p>
<div class="filters">
<select id="variety" aria-label="Variety"></select>
<select id="region" aria-label="Region"></select>
</div>
<p id="msg" role="status">Loading prices...</p>
<div class="big" id="big">-</div>
<p class="meta" id="meta"></p>
<div class="chartbox"><canvas id="chart"></canvas></div>
<h2>Latest by region</h2>
<table>
<thead><tr><th>Region</th><th class="n">Per kg</th><th class="n">Change</th></tr></thead>
<tbody id="rows"></tbody></table>
</main>
<footer>Prices in Philippine pesos (PHP) per kilogram. The source of each entry is recorded by the site admin.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const peso=n=>'₱'+Number(n).toFixed(2);
const delta=d=>d===null?'-':(d>0?'+':'')+d.toFixed(2);
let regions=[],varieties=[],prices=[],chart;
async function all(table,cols,order){let out=[],f=0;for(;;){const{data,error}=await sb.from(table).select(cols).order(order).order('id').range(f,f+999);if(error)throw error;out.push(...data);if(data.length<1000)return out;f+=1000}}
async function init(){
 try{[regions,varieties,prices]=await Promise.all([all('regions','*','sort_order'),all('varieties','*','name'),all('prices','*','date')])}
 catch(e){$('msg').textContent='Could not load prices. Please try again later.';return}
 $('variety').innerHTML=varieties.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('');
 $('region').innerHTML='<option value="">All regions (average)</option>'+regions.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('');
 $('variety').onchange=$('region').onchange=render;
 $('msg').textContent=prices.length?'':'No prices have been published yet.';render()}
function render(){
 const v=+$('variety').value,r=+$('region').value,vp=prices.filter(p=>p.variety_id===v);
 // table: latest price and change per region
 $('rows').innerHTML=regions.map(rg=>{const s=vp.filter(p=>p.region_id===rg.id);
  if(!s.length)return`<tr data-r="${rg.id}"><td>${esc(rg.name)}</td><td class="n" colspan="2">No data</td></tr>`;
  const a=s[s.length-1],b=s[s.length-2],d=b?a.price_per_kg-b.price_per_kg:null;
  return`<tr data-r="${rg.id}" class="${rg.id===r?'sel':''}"><td>${esc(rg.name)}</td><td class="n">${peso(a.price_per_kg)}</td><td class="n ${d>0?'up':d<0?'down':''}">${delta(d)}</td></tr>`}).join('');
 $('rows').querySelectorAll('tr').forEach(t=>t.onclick=()=>{$('region').value=t.dataset.r;render()});
 // chart: selected region, or the average of all regions per date
 const src=r?vp.filter(p=>p.region_id===r):vp,byDate={};
 src.forEach(p=>(byDate[p.date]??=[]).push(+p.price_per_kg));
 const labels=Object.keys(byDate).sort(),data=labels.map(d=>byDate[d].reduce((a,b)=>a+b,0)/byDate[d].length);
 // headline number
 if(data.length){const last=data[data.length-1],prev=data.length>1?data[data.length-2]:null,d=prev===null?null:last-prev;
  $('big').textContent=peso(last);
  $('meta').innerHTML=`per kg &middot; ${labels[labels.length-1]}`+(d===null?'':` &middot; <span class="${d>0?'up':d<0?'down':''}">${delta(d)}</span>`)}
 else{$('big').textContent='-';$('meta').textContent='No data for this selection.'}
 const css=getComputedStyle(document.documentElement),accent=css.getPropertyValue('--accent').trim(),line=css.getPropertyValue('--line').trim(),mute=css.getPropertyValue('--mute').trim();
 chart&&chart.destroy();
 chart=new Chart($('chart'),{type:'line',data:{labels,datasets:[{data,borderColor:accent,backgroundColor:accent,borderWidth:2,tension:.25,pointRadius:2}]},
  options:{maintainAspectRatio:false,plugins:{legend:{display:false}},
   scales:{x:{grid:{display:false},ticks:{color:mute,maxTicksLimit:6}},y:{grid:{color:line},ticks:{color:mute,callback:x=>'₱'+x}}}}})}
init();
</script></body></html>
